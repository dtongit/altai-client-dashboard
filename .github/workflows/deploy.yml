name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main", "stage"]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js (Prod)
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.optima.altaiweb.online/api/v1/client
          NEXT_PUBLIC_APP_DOMAIN: my.altaiweb.online

      - name: Build with Next.js (Stage)
        if: github.ref == 'refs/heads/stage'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://stage-api.optima.altaiweb.online/api/v1/client
          NEXT_PUBLIC_APP_DOMAIN: stage.altaiweb.online

      - name: Deploy Prod to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=altai-client-dashboard --commit-dirty=true

      - name: Deploy Stage to Cloudflare Pages
        if: github.ref == 'refs/heads/stage'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=altai-stage-dashboard --branch=stage --commit-dirty=true
